[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta"
version = "1.0.0"
description = "Natural Language to Database Query — English to SQL, MQL, or Cypher"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WalnutIcecream"}
]
keywords = ["nlp", "sql", "mongodb", "neo4j", "text-to-sql", "natural-language", "query"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
]

[project.optional-dependencies]
nlp = ["transformers>=4.40.0", "torch>=2.0.0"]
mongo = ["pymongo>=4.0.0"]
neo4j = ["neo4j>=5.0.0"]
all = [
    "rosetta[nlp,mongo,neo4j]",
]

[project.scripts]
rosetta = "rosetta.cli:main"

[tool.setuptools.packages.find]
include = ["rosetta*"]
